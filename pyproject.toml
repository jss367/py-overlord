[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py-overlord"
version = "0.1.0"
description = "Dominion AI Genetic Trainer"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloudpickle",
    "coloredlogs",
    "matplotlib",
    "PyYAML",
    "scipy",
    "seaborn",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dominion*"]

[tool.setuptools.package-data]
"dominion.reporting.curated_strategy_guides" = ["*.html"]

[project.scripts]
dominion-trainer = "dominion.runner:main"

[project.optional-dependencies]
gepa = ["gepa==0.1.4"]
gepa-api = ["gepa==0.1.4", "litellm>=1.105.1,<2"]
rl = ["torch>=2.6", "gymnasium>=1.0", "numpy>=2.0"]
dev = ["pytest", "ruff", "setuptools>=61.0", "wheel"]

[tool.ruff.lint]
select = ["E9", "F"]
