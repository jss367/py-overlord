name: Run Tests

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    - name: Verify pytest collects all tests
      run: python scripts/ensure_pytest_collection.py
    - name: Verify board and strategy catalog is current
      run: |
        catalog_output="$(mktemp -d)"
        PYTHONPATH=. python scripts/render_catalog.py --output-dir "$catalog_output"
        diff --recursive --unified reports/boards "$catalog_output/boards"
        # Tournament runs intentionally replace the clean catalog's empty leaderboard.
        diff --recursive --unified --exclude=leaderboard.html reports/strategies "$catalog_output/strategies"
        PYTHONPATH=. python scripts/validate_strategy_leaderboard.py reports/strategies/leaderboard.html
    - name: Run tests
      run: pytest -q
