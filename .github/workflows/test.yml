name: Run Tests

on:
  pull_request:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev,rl]'
    - name: Verify reinforcement-learning dependencies
      run: python -c "import gymnasium; import torch"
    - name: Verify pytest collects all tests
      run: python scripts/ensure_pytest_collection.py
    - name: Verify board and strategy catalog is current
      run: python scripts/check_catalog.py
    - name: Run tests
      run: pytest -q
